services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofeat_password}
      POSTGRES_DB: ${POSTGRES_DB:-proofeat}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofeat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: []
  ocr:
    image: proofeat-ocr
    restart: unless-stopped
    environment:
      - OCR_WORKERS=2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-me-superadmin}
      DATABASE_URL: postgresql://${POSTGRES_USER:-proofeat}:${POSTGRES_PASSWORD:-proofeat_password}@db:5432/${POSTGRES_DB:-proofeat}?schema=public
      OCR_URL: http://ocr:8000
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Tunis}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_processed:/app/processed
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_certbot:/var/www/certbot
volumes:
  db_data:
  backend_uploads:
  backend_processed:
  frontend_certbot:
